<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Smart Step mobile application demo" />
  <title>Smart Step Demo</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #fff9f5, #dff8f5);
      color: #2d3748;
    }

    main {
      width: min(92vw, 520px);
      margin: 32px auto;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #4a5568;
      line-height: 1.5;
    }

    video {
      display: block;
      width: min(100%, 384px);
      max-height: 78vh;
      margin: 24px auto;
      border-radius: 24px;
      background: #2d3748;
      box-shadow: 0 18px 45px rgb(45 55 72 / 25%);
    }

    a {
      color: #1677c8;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main>
    <h1>Smart Step</h1>
    <p>94-second mobile application walkthrough</p>
    <video controls playsinline preload="metadata" poster="demo/preview.png">
      <source src="demo/SmartSteps.webm" type="video/webm" />
      <source src="demo/SmartSteps.mp4" type="video/mp4" />
      Your browser does not support HTML video playback.
    </video>
    <a href="https://github.com/Herenyew/Smart-Steps">View source code on GitHub</a>
  </main>
</body>

</html>
